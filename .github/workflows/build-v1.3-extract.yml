name: Build FLM BOOST v1.3 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FLM BOOST v1.3 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 3 -type f -iname 'FLM-BOOST-v1.3-Shizuku-Source.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo 'ERROR: Upload FLM-BOOST-v1.3-Shizuku-Source.zip to repository root.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/flm-v13"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/flm-v13"
          SRC="$RUNNER_TEMP/flm-v13/FLM-BOOST"
          test -f "$SRC/settings.gradle" || { echo 'ERROR: settings.gradle missing in ZIP'; exit 1; }
          test -f "$SRC/app/build.gradle" || { echo 'ERROR: app/build.gradle missing in ZIP'; exit 1; }
          cp -a "$SRC/." ./
          echo 'FLM BOOST v1.3 extracted successfully.'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLM-BOOST-v1.3-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
