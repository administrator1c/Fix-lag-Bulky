
name: FLM BOOST V2 Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -type f -iname '*.zip' \
            -not -path './.git/*' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ZIP not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/flm"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/flm"

          PROJECT=$(find "$RUNNER_TEMP/flm" \
            -type f \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT")" \
            >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" \
            >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace \
            :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLM-BOOST-V2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
