
name: Extract ZIP and Build FLM BOOST APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -type f -iname '*.zip' \
            -not -path './.git/*' -print -quit)
          test -n "$ZIP" || {
            echo "ZIP not found"
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/flm-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/flm-source"
          PROJECT=$(find "$RUNNER_TEMP/flm-source" \
            -type f -name settings.gradle -print -quit)
          test -n "$PROJECT" || exit 1
          echo "PROJECT_DIR=$(dirname "$PROJECT")" \
            >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLM-BOOST-V2-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
